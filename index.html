<script>
'use strict';
/* =====================================================================
   Portal de la temporada · Club de Golf de Tecnatom
   Toda la información vive en la base de datos (Supabase). Este fichero
   solo la muestra y, para los administradores, la cambia.
   La temporada que muestra es la de TEMPORADA (cambiarla al copiar el portal).
   ===================================================================== */
const TEMPORADA = 2027;
const SB_URL = 'https://peztstoiswhmlmpyhefl.supabase.co';
const SB_CLAVE = '"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlenRzdG9pc3dobWxtcHloZWZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1Mzk5MTMsImV4cCI6MjA5NzExNTkxM30.D-e9iyp8tXU_mQ8Jd7fx3qL36cyW6hOdJF7hSIAnxqU"';   // clave pública de solo lectura; la seguridad la pone la base de datos
const SB_FOTOS = SB_URL + '/storage/v1/object/public';
const ARCHIVO_TEMPORADA = 'https://clubdegolfdetecnatom.github.io/temporada' + TEMPORADA + '.html';

/* el enlace del correo de invitación o de "olvidé mi contraseña" debe acabar en el formulario de contraseña */
const ENLACE_CORREO = /type=(invite|recovery)/.test(location.hash);
const sb = window.supabase.createClient(SB_URL, SB_CLAVE, { auth: { persistSession: true, detectSessionInUrl: true } });

/* ---------- estado ---------- */
const D = {
  temporada: null, competiciones: [], dias: [], jugadores: [], tj: [], inscripciones: [], resultados: [],
  equipos: [], equiposJug: [], premios: [], eventosFotos: [], fotos: [],
  admin: false, email: null, licencias: {}, borradores: [], fotosRes: [], campos: []
};
const V = { tipo: 'stableford' };      // pestaña de clasificación elegida
let yo = leer('tecnatom_jugador_id');

/* ---------- utilidades ---------- */
function leer(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function guardar(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function hoyISO() { const p = madridPartes(new Date()); return p.y + '-' + dos(p.m) + '-' + dos(p.d); }
function dos(n) { return String(n).padStart(2, '0'); }
function madridPartes(fecha) {
  const f = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Madrid', hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric' });
  const o = {}; f.formatToParts(fecha).forEach(p => { o[p.type] = Number(p.value); });
  return { y: o.year, m: o.month, d: o.day, h: o.hour, mi: o.minute };
}
/* fecha y hora "de pared" en Madrid → instante real */
function madrid(iso, hhmm) {
  const [y, m, d] = iso.split('-').map(Number); const [h, mi] = String(hhmm || '00:00').split(':').map(Number);
  const supuesto = Date.UTC(y, m - 1, d, h, mi);
  const p = madridPartes(new Date(supuesto));
  const desfase = Date.UTC(p.y, p.m - 1, p.d, p.h, p.mi) - supuesto;
  return new Date(supuesto - desfase);
}
function sumarDias(iso, n) { const [y, m, d] = iso.split('-').map(Number); const t = new Date(Date.UTC(y, m - 1, d + n)); return t.getUTCFullYear() + '-' + dos(t.getUTCMonth() + 1) + '-' + dos(t.getUTCDate()); }
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const MESES_L = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const SEMANA = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
function fechaCorta(iso) { if (!iso) return 'fecha por definir'; const [y, m, d] = iso.split('-').map(Number); return d + ' ' + MESES[m - 1]; }
function fechaLarga(iso) { if (!iso) return 'Fecha por definir'; const [y, m, d] = iso.split('-').map(Number); const s = SEMANA[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]; return s.charAt(0).toUpperCase() + s.slice(1) + ' ' + d + ' de ' + MESES_L[m - 1]; }
function momento(fecha) { const p = madridPartes(fecha); const s = SEMANA[new Date(Date.UTC(p.y, p.m - 1, p.d)).getUTCDay()]; return s + ' ' + p.d + ' de ' + MESES_L[p.m - 1] + ' a las ' + dos(p.h) + ':' + dos(p.mi); }
function hcpTxt(h) { return Number(h).toFixed(1).replace('.', ','); }
function nombreCorto(n) { const p = String(n).trim().split(/\s+/); return p.length >= 3 ? p.slice(0, -1).join(' ') : p.join(' '); }
function iniciales(n) { const p = String(n).split(' '); return (p[0][0] + (p[1] ? p[1][0] : '')).toUpperCase(); }
function urlFoto(f, mini) { const r = (mini && f.ruta_mini) ? f.ruta_mini : f.ruta; return SB_FOTOS + '/' + encodeURIComponent(f.bucket) + '/' + String(r).split('/').map(encodeURIComponent).join('/'); }
function aviso(txt, mal) { const a = document.getElementById('aviso'); a.textContent = txt; a.className = mal ? 'mal' : 'ok'; clearTimeout(aviso.t); aviso.t = setTimeout(() => a.classList.add('oculto'), 3500); }
function errorLegible(e) {
  const m = String((e && (e.message || e.error_description)) || e);
  if (/row-level security|permission denied|42501/i.test(m)) return 'No está permitido (fuera de plazo o sin permiso).';
  if (/duplicate key/i.test(m)) return 'Ya estaba hecho.';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Sin conexión. Vuelve a intentarlo.';
  return m.slice(0, 160);
}

/* ---------- datos de consulta ---------- */
const jugador = id => D.jugadores.find(j => j.id === Number(id));
const competicion = id => D.competiciones.find(c => c.id === Number(id));
const dia = id => D.dias.find(d => d.id === Number(id));
const diasDe = c => D.dias.filter(d => d.competicion_id === c.id).sort((a, b) => a.orden - b.orden);
const enAlta = () => D.tj.filter(t => t.activo).map(t => jugador(t.jugador_id)).filter(Boolean).sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
const inscritos = d => D.inscripciones.filter(i => i.dia_id === d.id).map(i => Object.assign({}, jugador(i.jugador_id), { comentario: i.comentario })).filter(j => j.id).sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
const apuntado = (d, jid) => D.inscripciones.some(i => i.dia_id === d.id && i.jugador_id === Number(jid));
const cuotaPagada = jid => (D.tj.find(t => t.jugador_id === jid) || {}).cuota_pagada;

function plazo(d) {
  const c = competicion(d.competicion_id);
  if (!d.fecha || !d.campo || !c) return null;
  const abre = d.insc_abre ? new Date(d.insc_abre) : madrid(sumarDias(d.fecha, -c.insc_abre_dias), '00:00');
  const cierra = d.insc_cierra ? new Date(d.insc_cierra) : madrid(sumarDias(d.fecha, -c.insc_cierra_dias), String(c.insc_cierra_hora || '14:00').slice(0, 5));
  const ahora = new Date();
  return { abre, cierra, abierta: ahora >= abre && ahora < cierra, antes: ahora < abre };
}
function hcpJuego(j, d) {
  const h = Math.min(Number(j.hcp), 36);
  const cr = j.sexo === 'M' ? d.cr_m : d.cr_h, sl = j.sexo === 'M' ? d.slope_m : d.slope_h;
  if (cr == null || sl == null || d.par == null) return null;
  return Math.round(h * (sl / 113) + (Number(cr) - d.par));
}
function estado(c) {
  const ds = diasDe(c), con = ds.filter(d => d.fecha).sort((a, b) => a.fecha.localeCompare(b.fecha)), hoy = hoyISO();
  if (!con.length) return { txt: 'Fecha por definir', cls: 'p-prox' };
  if (con.some(d => (plazo(d) || {}).abierta)) return { txt: 'Inscripción abierta', cls: 'p-oro' };
  const ini = con[0].fecha, fin = con[con.length - 1].fecha;
  if (fin < hoy && con.length === ds.length) return { txt: 'Terminada', cls: 'p-gris' };
  if (ini <= hoy) return { txt: 'En juego', cls: 'p-oro' };
  return { txt: 'Próxima', cls: 'p-prox' };
}
function cuandoComp(c) {
  const ds = diasDe(c).filter(d => d.fecha);
  if (!ds.length) return 'Fecha por definir';
  if (c.tipo === 'liga') return ds.length + (ds.length === 1 ? ' jornada' : ' jornadas') + ' · ' + fechaCorta(ds[0].fecha) + ' – ' + fechaCorta(ds[ds.length - 1].fecha);
  const campos = [...new Set(ds.map(d => d.campo).filter(Boolean))].join(' y ');
  return ds.map(d => fechaCorta(d.fecha)).join(', ') + (campos ? ' · ' + campos : '');
}
function nombreDia(d) { const c = competicion(d.competicion_id); return c.tipo === 'liga' ? 'Jornada ' + d.orden : (diasDe(c).length > 1 ? 'Día ' + d.orden : ''); }

/* Clasificación de una competición (suma o N mejores tarjetas). tipo: 'stableford' | 'scratch' */
function clasificacion(c, tipo) {
  const ids = diasDe(c).map(d => d.id);
  const por = new Map();
  D.resultados.filter(r => ids.includes(r.dia_id) && r[tipo] != null).forEach(r => {
    if (!por.has(r.jugador_id)) por.set(r.jugador_id, []);
    por.get(r.jugador_id).push(r[tipo]);
  });
  const filas = [...por.entries()].map(([jid, ps]) => {
    const j = jugador(jid) || { nombre: '?', hcp: 99 };
    const cuentan = c.tipo === 'liga' ? [...ps].sort((a, b) => b - a).slice(0, c.mejores_tarjetas || 4) : ps;
    return { id: jid, nombre: j.nombre, hcp: Number(j.hcp), sexo: j.sexo, total: cuentan.reduce((s, v) => s + v, 0), jugadas: ps.length };
  });
  return filas.sort((a, b) => b.total !== a.total ? b.total - a.total : (tipo === 'stableford' ? a.hcp - b.hcp : b.hcp - a.hcp));
}
/* Premios no acumulables: primero scratch; en hándicap se salta a quien ya tiene premio */
function premiosCalculados(c) {
  const out = [], conPremio = new Set();
  clasificacion(c, 'scratch').slice(0, c.premios_scratch).forEach((f, i) => { out.push({ categoria: 'scratch', puesto: i + 1, jugador_id: f.id, nombre: 'Premio ' + (i + 1) + '.º scratch', total: f.total }); conPremio.add(f.id); });
  let n = 0;
  clasificacion(c, 'stableford').forEach((f, i) => {
    if (n >= c.premios_hcp || conPremio.has(f.id)) return;
    n++; out.push({ categoria: 'hcp', puesto: i + 1, jugador_id: f.id, nombre: 'Premio ' + n + '.º hándicap', total: f.total });
  });
  return out;
}
function resultadoRyder(c) {
  const eqs = D.equipos.filter(e => e.competicion_id === c.id && e.puntos != null);
  const bandos = [...new Set(eqs.map(e => e.bando))];
  return bandos.map(b => {
    const ps = eqs.filter(e => e.bando === b).map(e => Number(e.puntos));
    const v = c.ryder_regla === 'suma' ? ps.reduce((s, x) => s + x, 0) : ps.reduce((s, x) => s + x, 0) / ps.length;
    return { bando: b, puntos: Math.round(v * 10) / 10, equipos: ps.length };
  }).sort((a, b) => b.puntos - a.puntos);
}

/* ---------- carga ---------- */
async function q(consulta) { const { data, error } = await consulta; if (error) throw error; return data || []; }
async function cargar() {
  const [temps, comps, tj, jugs, campos] = await Promise.all([
    q(sb.from('temporadas').select('anio,edicion,estado').eq('anio', TEMPORADA)),
    q(sb.from('competiciones').select('*').eq('temporada', TEMPORADA).order('orden')),
    q(sb.from('temporada_jugadores').select('jugador_id,activo,baja_desde,cuota_pagada').eq('temporada', TEMPORADA)),
    q(sb.from('jugadores').select('id,nombre,sexo,hcp')),
    q(sb.from('campos').select('*').order('nombre'))
  ]);
  D.campos = campos;
  D.temporada = temps[0] || { anio: TEMPORADA, edicion: '', estado: 'preparacion' };
  D.competiciones = comps; D.tj = tj; D.jugadores = jugs.map(j => Object.assign(j, { hcp: Number(j.hcp) }));
  const cids = comps.map(c => c.id);
  D.dias = cids.length ? await q(sb.from('dias').select('*').in('competicion_id', cids)) : [];
  const dids = D.dias.map(d => d.id);
  const [ins, res, eqs, prem, evs] = await Promise.all([
    dids.length ? q(sb.from('inscripciones_dias').select('dia_id,jugador_id,comentario').in('dia_id', dids)) : [],
    dids.length ? q(sb.from('resultados_dias').select('dia_id,jugador_id,stableford,scratch,dudoso,publicado').in('dia_id', dids)) : [],
    cids.length ? q(sb.from('equipos').select('*').in('competicion_id', cids)) : [],
    cids.length ? q(sb.from('premios').select('*').in('competicion_id', cids)) : [],
    q(sb.from('eventos_fotos').select('id,anio,nombre,meta,fecha,competicion_id').eq('anio', TEMPORADA))
  ]);
  D.inscripciones = ins; D.equipos = eqs; D.premios = prem; D.eventosFotos = evs;
  D.resultados = res.filter(r => r.publicado); D.borradores = res;
  const eqIds = eqs.map(e => e.id);
  D.equiposJug = eqIds.length ? await q(sb.from('equipos_jugadores').select('equipo_id,jugador_id').in('equipo_id', eqIds)) : [];
  const evIds = evs.map(e => e.id);
  D.fotos = evIds.length ? await q(sb.from('fotos').select('id,evento_id,bucket,ruta,ruta_mini,pie,orden,visible').in('evento_id', evIds).order('orden')) : [];
  if (D.admin) {
    const lic = await q(sb.from('jugadores').select('id,licencia'));
    D.licencias = Object.fromEntries(lic.map(x => [x.id, x.licencia]));
    D.fotosRes = dids.length ? await q(sb.from('fotos_resultados').select('*').in('dia_id', dids).order('id')) : [];
  }
}

function cargarImagen(file) { return new Promise((ok, mal) => { const u = URL.createObjectURL(file), i = new Image(); i.onload = () => { URL.revokeObjectURL(u); ok(i); }; i.onerror = () => { URL.revokeObjectURL(u); mal(new Error('Formato de imagen no compatible: guárdala como JPG')); }; i.src = u; }); }

function aJpeg(c, q2) { return new Promise((ok, mal) => c.toBlob(b => b ? ok(b) : mal(new Error('No se pudo preparar la foto')), 'image/jpeg', q2)); }

let cargaJsPDF = null;
function cargarScript(src) { return new Promise((ok, mal) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => mal(new Error('No se pudo cargar el generador de PDF. Comprueba la conexión.')); document.head.appendChild(s); }); }
async function jsPDFListo() {

function logoTarjeta() {

}
const golpesHoyo = (h, si) => h >= si ? Math.floor((h - si) / 18) + 1 : 0;

/* Tarjetas de juego de un día: formato oficial del club, 3 por hoja A4, en gris para imprimir */
async function generarTarjetas(d) {
  const l = inscritos(d);
  if (!l.length) throw new Error('No hay nadie inscrito en este día');
  const [JsPDF, logo] = await Promise.all([jsPDFListo(), logoTarjeta()]);
  const c = competicion(d.competicion_id), campo = recorrido(d);
  const PAR = campo ? campo.par : [], SI = campo ? campo.si : [], MH = campo && campo.metros_h || [], MM = campo && campo.metros_m || [];
  const anio = d.fecha ? Number(d.fecha.slice(0, 4)) : TEMPORADA;
  const T1 = ((D.temporada.edicion ? D.temporada.edicion + ' ' : '') + 'Campeonato de Golf de Tecnatom ' + TEMPORADA).toUpperCase();
  const T2 = (campo && campo.nombre) || d.campo || 'Campo por definir';
  const FECHA = [c.nombre, nombreDia(d), d.fecha ? fechaLarga(d.fecha) + ' de ' + anio : 'Fecha por definir'].filter(Boolean).join(' · ');

  const doc = new JsPDF({ unit: 'pt', format: 'a4' });
  const PW = doc.internal.pageSize.getWidth(), PH = doc.internal.pageSize.getHeight();
  const MARGEN = 16, HUECO = 14, POR_HOJA = 3;
  const U = { t1: 20.1, t2: 15.95, fecha: 14.1, jug: 20.1, hdr: 15.95, data: 14.1, parhcp: 15.95, input: 21, foot: 15.95, marc: 21 };
  const tot = U.t1 + U.t2 + U.fecha + U.jug + U.hdr + 4 * U.data + U.parhcp + 2 * U.input + U.foot + U.marc;
  const F = ((PH - 2 * MARGEN - (POR_HOJA - 1) * HUECO) / POR_HOJA) / tot;
  const H = Object.fromEntries(Object.entries(U).map(([k, v]) => [k, v * F]));
  const x0 = MARGEN, ancho = PW - 2 * MARGEN, ppu = ancho / (20.7 + 18 * 10 + 12);
  const wA = 20.7 * ppu, wH = 10 * ppu, wT = 12 * ppu;
  const X = [x0]; for (let i = 0; i < 18; i++) X.push(x0 + wA + i * wH); X.push(x0 + wA + 18 * wH);
  const xM = X[12], xQ = X[16], wBL = xM - X[1], wMP = xQ - xM, wQT = (X[19] + wT) - xQ, xI9 = X[9], wAI = xI9 - x0, wJL = xM - xI9;
  const GR = '#AAAAAA', GR2 = '#555555', JUG = '#E0E0E0', CAB = '#555555', F1 = '#DDDDDD', F2 = '#F2F2F2', PH_ = '#BBBBBB', TOT = '#AAAAAA';
  const ESTILO = { n: 'normal', b: 'bold', i: 'italic' };

  const caja = (x, y, w, h, col) => { doc.setFillColor(col); doc.rect(x, y, w, h, 'F'); };
  const texto = (x, y, w, h, s, est, tam, col, izq) => {
    s = s == null ? '' : String(s); if (!s) return;
    doc.setFont('helvetica', ESTILO[est || 'n']); doc.setFontSize(tam || 8); doc.setTextColor(col || '#000000');
    const base = y + h / 2 + (tam || 8) * 0.35;
    doc.text(s, izq ? x + 3 : x + (w - doc.getTextWidth(s)) / 2, base);
  };
  const lh = (x1, x2, y, lw, col) => { doc.setDrawColor(col || GR); doc.setLineWidth(lw || 0.4); doc.line(x1, y, x2, y); };
  const lv = (x, y1, y2, lw, col) => { doc.setDrawColor(col || GR); doc.setLineWidth(lw || 0.4); doc.line(x, y1, x, y2); };
  const rejilla = (y, h) => { doc.setDrawColor(GR); doc.setLineWidth(0.25); X.forEach(x => doc.line(x, y, x, y + h)); doc.line(X[19] + wT, y, X[19] + wT, y + h); lh(x0, x0 + ancho, y + h); };
  const filaDatos = (y, h, etiqueta, valores, fondo, tam, negrita, conTotal) => {
    caja(x0, y, wA, h, fondo); for (let i = 1; i <= 18; i++) caja(X[i], y, wH, h, fondo);
    caja(X[19], y, wT, h, TOT); rejilla(y, h);
    texto(x0, y, wA, h, etiqueta, 'b', tam - 1, null, true);
    for (let i = 0; i < 18; i++) texto(X[i + 1], y, wH, h, valores[i], negrita ? 'b' : 'n', tam);
    const nums = valores.filter(v => typeof v === 'number');
    if (conTotal !== false && nums.length === 18) texto(X[19], y, wT, h, suma(nums), 'b', tam);
  };
  const filaVacia = (y, h, etiqueta, fondo) => {
    caja(x0, y, wA, h, fondo); for (let i = 1; i <= 18; i++) caja(X[i], y, wH, h, fondo);
    caja(X[19], y, wT, h, TOT); rejilla(y, h);
    texto(x0, y, wA, h, etiqueta, 'b', 7, null, true);
    lh(x0, x0 + ancho, y, 0.6, '#000000'); lh(x0, x0 + ancho, y + h, 0.6, '#000000');
  };

  function tarjeta(j, yTop) {
    const hj = hcpJuego(j, d), parHcp = hj == null || !PAR.length ? [] : PAR.map((p, i) => p + golpesHoyo(hj, SI[i]));
    const hjTxt = hj == null ? '—' : String(hj);
    let y = yTop; const HC = H.t1 + H.t2 + H.fecha;
    caja(x0, y, wA, HC, '#FFFFFF');
    if (logo) { const k = Math.min((wA - 4) / logo.w, (HC - 4) / logo.h), w = logo.w * k, h = logo.h * k; doc.addImage(logo.url, 'JPEG', x0 + (wA - w) / 2, y + (HC - h) / 2, w, h); }
    const tresCajas = (h, izq, med, der) => {
      if (izq) texto(X[1], y, wBL, h, izq[0], izq[1], izq[2], null, izq[3]);
      if (med) texto(xM, y, wMP, h, med, 'n', 6.5); if (der) texto(xQ, y, wQT, h, der, 'n', 6.5);
      [X[1], X[1] + wBL, xM + wMP, xQ, xQ + wQT].forEach(x => lv(x, y, y + h));
    };
    lh(X[1], X[19] + wT, y); lv(xM, y, y + H.t1);
    tresCajas(H.t1, [T1, 'b', 10, false], 'Resultado Stableford Scratch', 'Resultado Stableford Handicap'); y += H.t1;
    lh(X[1], X[1] + wBL, y); tresCajas(H.t2, [T2, 'b', 9, true]); y += H.t2;
    tresCajas(H.fecha, [FECHA, 'i', 8, true]); y += H.fecha;
    lh(X[1], X[1] + wBL, y);
    caja(x0, y, wAI + wJL, H.jug, JUG);
    texto(x0, y, wAI, H.jug, 'JUGADOR: ' + j.nombre, 'b', 9, null, true);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9); const hm = 'HCP: ' + hjTxt, twm = doc.getTextWidth(hm);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(6.5); const hs = '(' + hcpTxt(j.hcp) + ')', tws = doc.getTextWidth(hs);
    const xs = xI9 + (wJL - twm - 3 - tws) / 2, bl = y + H.jug / 2 + 9 * 0.35;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor('#000000'); doc.text(hm, xs, bl);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(6.5); doc.setTextColor(GR2); doc.text(hs, xs + twm + 3, bl - 0.5);
    [x0, xI9 + wJL, xM, xM + wMP, xQ, xQ + wQT].forEach(x => lv(x, y, y + H.jug));
    lh(x0, X[19] + wT, y); lh(x0, X[19] + wT, y + H.jug); y += H.jug;
    caja(x0, y, ancho, H.hdr, CAB); rejilla(y, H.hdr);
    texto(x0, y, wA, H.hdr, 'HOYO', 'b', 8, '#FFFFFF', true);
    for (let i = 0; i < 18; i++) texto(X[i + 1], y, wH, H.hdr, i + 1, 'b', 8, '#FFFFFF');
    texto(X[19], y, wT, H.hdr, 'TOTAL', 'b', 7, '#FFFFFF'); y += H.hdr;
    filaDatos(y, H.data, 'METROS CAB.', MH, F1, 8); y += H.data;
    filaDatos(y, H.data, 'METROS DAM.', MM, F2, 8); y += H.data;
    filaDatos(y, H.data, 'PAR', PAR, F1, 9, true); y += H.data;
    filaDatos(y, H.data, 'HANDICAP', SI, F2, 8, true, false); y += H.data;
    filaDatos(y, H.parhcp, 'PAR + HCP', parHcp, PH_, 10, true); y += H.parhcp;
    filaVacia(y, H.input, 'GOLPES', '#FFFFFF'); y += H.input;
    filaVacia(y, H.input, 'PUNTOS', '#FFFFFF'); y += H.input;
    const wMarc = wA + 9 * wH;
    caja(x0, y, ancho, H.foot, '#FFFFFF');
    texto(x0, y, wMarc, H.foot, 'MARCADOR: _________________________ FIRMA: ________', 'i', 7, null, true);
    texto(x0 + wMarc, y, ancho - wMarc, H.foot, 'JUGADOR (' + hjTxt + '): ' + j.nombre + '   FIRMA: ________', 'i', 7, null, true);
    doc.setDrawColor(GR); doc.setLineWidth(0.4); doc.rect(x0, y, ancho, H.foot); y += H.foot;
    filaVacia(y, H.marc, 'GOLPES MAR.', F2); y += H.marc;
    doc.setDrawColor('#000000'); doc.setLineWidth(1); doc.rect(x0, yTop, ancho, y - yTop);
  }

  const alto = (PH - 2 * MARGEN - (POR_HOJA - 1) * HUECO) / POR_HOJA;
  l.forEach((j, n) => {
    if (n && n % POR_HOJA === 0) doc.addPage();
    tarjeta(j, MARGEN + (n % POR_HOJA) * (alto + HUECO));
  });
  const limpio = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '');
  doc.save(['Tarjetas', limpio(c.nombre), limpio(nombreDia(d)), d.fecha || '', limpio(T2)].filter(Boolean).join('_') + '.pdf');
  const faltan = [];
  if (!campo) faltan.push('el recorrido del campo');
  if (l.some(j => hcpJuego(j, d) == null)) faltan.push('CR y slope de ' + (l.some(j => j.sexo === 'M' && hcpJuego(j, d) == null) ? 'rojas' : 'amarillas'));
  return l.length + ' tarjetas descargadas' + (faltan.length ? ' (sin ' + faltan.join(' ni ') + ')' : '');
}

/* ---------- visor de fotos ---------- */
let visor = { fotos: [], i: 0, titulo: '' };
function visorAbrir(evId, i) { const e = D.eventosFotos.find(x => x.id === evId); visor = { fotos: D.fotos.filter(f => f.evento_id === evId && f.visible !== false), i, titulo: e ? e.nombre : '' }; visorPintar(); document.getElementById('visor').classList.remove('oculto'); }
function visorPintar() { const f = visor.fotos[visor.i]; if (!f) return; document.getElementById('visor-img').src = urlFoto(f, false); document.getElementById('visor-pie').textContent = visor.titulo + (f.pie ? ' · ' + f.pie : '') + ' (' + (visor.i + 1) + '/' + visor.fotos.length + ')'; }
function visorMover(p) { if (visor.fotos.length < 2) return; visor.i = (visor.i + p + visor.fotos.length) % visor.fotos.length; visorPintar(); }
function visorCerrar() { document.getElementById('visor').classList.add('oculto'); document.getElementById('visor-img').removeAttribute('src'); }
document.addEventListener('keydown', e => { if (document.getElementById('visor').classList.contains('oculto')) return; if (e.key === 'Escape') visorCerrar(); if (e.key === 'ArrowLeft') visorMover(-1); if (e.key === 'ArrowRight') visorMover(1); });

/* ---------- arranque ---------- */
sb.auth.onAuthStateChange(evt => { if (evt === 'PASSWORD_RECOVERY') location.hash = '#/admin/nueva-clave'; });
(async () => {
  try { await comprobarAdmin(); await cargar(); }
  catch (e) { console.error(e); document.getElementById('app').innerHTML = '<div class="tarjeta vacio">No se ha podido cargar la temporada. Comprueba la conexión y vuelve a intentarlo.</div>'; return; }
  document.getElementById('pie-texto').textContent = (D.temporada.edicion ? D.temporada.edicion + ' Campeonato · ' : '') + 'Temporada ' + TEMPORADA;
  if (ENLACE_CORREO && D.email) { history.replaceState(null, '', location.pathname + '#/admin/nueva-clave'); }
  pintar();
})();
